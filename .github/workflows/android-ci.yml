name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew --max-workers=2 testStandaloneDebugUnitTest testPlayDebugUnitTest

    - name: Run Android Lint
      run: ./gradlew --max-workers=2 lintStandaloneDebug lintPlayDebug

    - name: Build Debug APK
      run: ./gradlew --max-workers=2 assembleStandaloneDebug assemblePlayDebug

    - name: Build Release APK
      run: ./gradlew --max-workers=2 assembleStandaloneRelease assemblePlayRelease

    - name: Verify APK privacy invariants
      run: python3 scripts/verify_android_privacy.py

    - name: Release build daemon before emulator tests
      run: ./gradlew --stop

    - name: Run Instrumented Tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        arch: x86_64
        target: google_apis
        script: ./gradlew --max-workers=2 -PisolatedDeviceValidation=true connectedStandaloneDebugAndroidTest connectedPlayDebugAndroidTest
