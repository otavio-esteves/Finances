name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

    - name: Set up JDK 17
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew --max-workers=2 testStandaloneDebugUnitTest testPlayDebugUnitTest

    - name: Run Android Lint
      run: ./gradlew --max-workers=2 lintStandaloneDebug lintPlayDebug

    - name: Build Debug APK
      run: ./gradlew --max-workers=2 assembleStandaloneDebug assemblePlayDebug

    - name: Build Release APK
      run: ./gradlew --max-workers=2 assembleStandaloneRelease assemblePlayRelease

    - name: Verify APK privacy invariants
      run: python3 scripts/verify_android_privacy.py

    - name: Release build daemon before emulator tests
      run: ./gradlew --stop

    - name: Enable KVM for the Android emulator
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm --settle
        if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
          echo '::error::The runner needs read and write access to /dev/kvm to start the Android emulator.'
          exit 1
        fi

    - name: Run Instrumented Tests
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      with:
        api-level: 35
        arch: x86_64
        target: google_apis
        script: ./gradlew --max-workers=2 -PisolatedDeviceValidation=true connectedStandaloneDebugAndroidTest connectedPlayDebugAndroidTest
